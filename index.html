<!DOCTYPE html>
<html lang="ro">
<head>
    <meta name="google-site-verification" content="JquvTxmipnlhSSfDwSYVKFbDTn8nVa7yGfwjpMPnAFM" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Candles & Art Deco | Lumina Magică</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ivory: #F9F7F2;
            --warm-sand: #DBCBB0;
            --charcoal: #1A1A1A;
            --gold: #C5A059;
            --transition-smooth: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--ivory);
            color: var(--charcoal);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 3000; 
            background: rgba(249, 247, 242, 0.95);
            backdrop-filter: blur(10px);
            height: 80px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        .logo { 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: 600; 
            cursor: pointer;
            color: var(--charcoal);
        }

        .hamburger {
            cursor: pointer;
            z-index: 3100;
            width: 40px;
            height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
        }

        .hamburger span {
            display: block;
            height: 2px;
            background-color: var(--charcoal);
            margin: 4px 0;
            transition: var(--transition-smooth);
        }

        .hamburger span:nth-child(1) { width: 30px; }
        .hamburger span:nth-child(2) { width: 20px; }
        .hamburger span:nth-child(3) { width: 30px; }
        
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(7px, 7px); width: 30px; }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px, -7px); width: 30px; }

        /* --- Full Screen Menu Overlay --- */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: var(--ivory);
            z-index: 2500; 
            display: flex;
            justify-content: center;
            align-items: center;
            /* Circle Reveal Animation */
            clip-path: circle(0% at 92% 6%); 
            transition: clip-path 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            pointer-events: none;
        }

        .menu-overlay.active { 
            clip-path: circle(150% at 92% 6%); 
            pointer-events: all;
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            text-align: center;
        }

        .menu-links a {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            color: var(--charcoal);
            text-decoration: none;
            opacity: 0;
            transform: translateY(30px);
            transition: color 0.3s ease;
        }

        .menu-links a:hover { color: var(--gold); font-style: italic; }

        .menu-overlay.active .menu-links a { 
            opacity: 1; 
            transform: translateY(0); 
            transition: 0.5s ease forwards;
        }
        /* Staggered animation for links */
        .menu-overlay.active .menu-links a:nth-child(1) { transition-delay: 0.1s; }
        .menu-overlay.active .menu-links a:nth-child(2) { transition-delay: 0.2s; }
        .menu-overlay.active .menu-links a:nth-child(3) { transition-delay: 0.3s; }

        /* --- Hero --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('h1.jpg') center/cover;
            color: white;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 { 
            font-size: 3.5rem; 
            margin-bottom: 1.5rem; 
            font-style: italic; 
            animation: fadeUp 1s ease forwards;
        }

        .btn-primary {
            padding: 1rem 3rem;
            background: var(--charcoal);
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            border: 1px solid var(--charcoal);
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: transparent;
            color: var(--charcoal);
        }
        
        .hero .btn-primary:hover { color: white; border-color: white; }

        /* --- Animations --- */
        .reveal-on-scroll { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .is-visible { opacity: 1; transform: translateY(0); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Grids --- */
        .section-padding { padding: 100px 5%; max-width: 1400px; margin: 0 auto; }
        
        .grid {
            display: grid;
            gap: 40px;
            /* Ensures cards stay a good size */
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
        }

        .product-card {
            background: transparent;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .product-card:hover { transform: translateY(-10px); }

        .img-box {
            height: 400px;
            margin-bottom: 20px;
            background: #fff;
            overflow: hidden;
        }

        .img-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            transition: transform 0.6s ease;
        }
        
        .product-card:hover .img-box img { transform: scale(1.05); }
        
        .product-card h3 { font-size: 1.4rem; margin-top: 10px; }
        .product-card p { color: #8b7355; margin-top: 5px; font-weight: 500; }

        /* --- Product Page --- */
        #product-page, #all-products-view { padding-top: 100px; min-height: 100vh; }

        .pdp-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
        }

        @media (min-width: 1024px) {
            .pdp-grid { grid-template-columns: 1.2fr 0.8fr; gap: 5rem; align-items: start; }
            .hero h1 { font-size: 5rem; }
        }

        /* --- Slider --- */
        .slider-container {
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
            background: #fff;
        }

        .slider-wrapper {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
        }

        .slider-wrapper img {
            min-width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.8);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .slider-btn:hover { background: #fff; }
        .slider-btn.prev { left: 15px; }
        .slider-btn.next { right: 15px; }

        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px 0;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e0e0e0;
            transition: all 0.3s;
        }

        .dot.active { background: var(--charcoal); transform: scale(1.3); }

        .pdp-info h1 { font-size: 2.5rem; margin-bottom: 10px; line-height: 1.1; }
        .price { font-size: 1.8rem; color: var(--gold); margin-bottom: 2rem; display: block; font-family: 'Cormorant Garamond', serif;}

        /* --- Page Switch --- */
        .active-page { display: block !important; animation: fadeIn 0.5s ease; }
        #main-site, #all-products-view, #product-page { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- Footer --- */
        footer { background: var(--charcoal); color: white; padding: 70px 5%; text-align: center; }
        .footer-links { margin: 30px 0; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .footer-links a { color: var(--warm-sand); text-decoration: none; font-size: 1rem; letter-spacing: 1px; transition: color 0.3s;}
        .footer-links a:hover { color: white; }
        footer iframe { width: 100%; max-width: 600px; height: 300px; margin-top: 30px; border: 0; opacity: 0.8; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="switchPage('main-site')">Magic Candles & Art Deco</div>
        <div class="hamburger" id="nav-toggle">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <div class="menu-overlay" id="menu">
        <div class="menu-links">
            <a href="#" onclick="handleMenuLink('main-site')">Acasă</a>
            <a href="#" onclick="handleMenuLink('all-products-view')">Colecție</a>
            <a href="#footer-contact" onclick="handleMenuLink('footer')">Contact</a>
        </div>
    </div>

    <div id="main-site" class="active-page">
        <section class="hero">
            <h1>Artă și Lumină</h1>
            <button class="btn-primary" onclick="switchPage('all-products-view')" style="background:transparent; border: 1px solid white;">Vezi Colecția</button>
        </section>

        <section class="section-padding">
            <h2 style="text-align: center; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;">Produse Recomandate</h2>
            <p style="text-align: center; margin-bottom: 50px; color: #777;">Descoperă cele mai iubite creații</p>
            
            <div class="grid" id="home-grid"></div>
            
            <div style="text-align: center; margin-top: 60px;" class="reveal-on-scroll">
                <button class="btn-primary" onclick="switchPage('all-products-view')">Vezi Tot Catalogul</button>
            </div>
        </section>
        
        <footer id="footer-contact">
            <p style="text-transform: uppercase; letter-spacing: 2px; font-size: 1.2rem; margin-bottom: 20px;">Contactează-ne</p>
            <div class="footer-links">
                <a href="https://wa.me/407XXXXXXXX" target="_blank">WhatsApp: +40 7XX XXX XXX</a>
                <a href="mailto:cristina_b_cretu@yahoo.com">Email</a>
                <a href="https://www.tiktok.com/@magic_light_behind_tears" target="_blank">TikTok</a>
            </div>
            <iframe src="https://maps.google.com/?cid=2763474062391980801&g_mp=CiVnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLkdldFBsYWNl"></iframe>
            <p style="margin-top: 50px; opacity: 0.4; font-size: 0.8rem;">© 2026 MAGIC CANDLES & ART DECO</p>
        </footer>
    </div>

    <div id="all-products-view">
        <div class="section-padding">
            <p onclick="switchPage('main-site')" style="cursor:pointer; margin-bottom: 25px; font-size: 0.8rem; letter-spacing: 1px; opacity: 0.6;">← ÎNAPOI LA ACASĂ</p>
            <h2 style="margin-bottom: 50px; text-transform: uppercase; text-align: center;">Întreaga Colecție</h2>
            <div class="grid" id="full-grid"></div>
        </div>
    </div>

    <div id="product-page">
        <div class="section-padding">
            <p onclick="window.history.back()" style="cursor:pointer; margin-bottom: 25px; font-size: 0.8rem; letter-spacing: 1px; opacity: 0.6;">← ÎNAPOI</p>
            <div class="pdp-grid">
                <div class="pdp-visual">
                    <div class="slider-container" id="slider-container">
                        <button class="slider-btn prev" onclick="moveSlide(-1)">❮</button>
                        <button class="slider-btn next" onclick="moveSlide(1)">❯</button>
                        <div class="slider-wrapper" id="slider-wrapper"></div>
                    </div>
                    <div class="slider-dots" id="slider-dots"></div>
                </div>
                <div class="pdp-info">
                    <h1 id="pdp-name"></h1>
                    <span class="price" id="pdp-price"></span>
                    <hr style="border: 0; border-top: 1px solid #ddd; margin: 25px 0;">
                    <p id="pdp-desc" style="color: #555; font-size: 1.1rem; line-height: 1.8;"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="products.js"></script>
    <script>
        let currentSlideIndex = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        function init() {
            if (typeof products === 'undefined') {
                console.warn("Please ensure products.js is loaded.");
                return;
            }
            
            const hGrid = document.getElementById('home-grid');
            const fGrid = document.getElementById('full-grid');
            
            // Render Full Grid
            fGrid.innerHTML = products.map(p => createCard(p)).join('');
            
            // Render first 3 for Home Grid
            hGrid.innerHTML = products.slice(0, 3).map(p => createCard(p)).join('');

            // Init Scroll Animation
            setupObserver();
        }

        function createCard(p) {
            return `
                <div class="product-card reveal-on-scroll" onclick="viewProduct(${p.id})">
                    <div class="img-box"><img src="${p.image}" alt="${p.name}"></div>
                    <h3>${p.name}</h3>
                    <p>${p.price}.00 RON</p>
                </div>
            `;
        }

        // --- Navigation Logic ---
        function switchPage(pageId, push = true) {
            document.querySelectorAll('#main-site, #all-products-view, #product-page').forEach(p => p.classList.remove('active-page'));
            
            const target = document.getElementById(pageId);
            if(target) target.classList.add('active-page');
            
            window.scrollTo(0,0);
            
            if(push) history.pushState({page: pageId}, "", "");
            
            // Re-trigger scroll observer for new content
            setTimeout(setupObserver, 100);
        }

        window.onpopstate = (e) => switchPage(e.state?.page || 'main-site', false);

        // --- Menu Logic ---
        const navToggle = document.getElementById('nav-toggle');
        const menu = document.getElementById('menu');

        navToggle.onclick = () => {
            navToggle.classList.toggle('active');
            menu.classList.toggle('active');
        };

        function handleMenuLink(destination) {
            // 1. Close Menu
            navToggle.classList.remove('active');
            menu.classList.remove('active');

            // 2. Wait slightly for animation then switch
            if(destination === 'footer') {
                switchPage('main-site');
                setTimeout(() => {
                    document.getElementById('footer-contact').scrollIntoView({ behavior: 'smooth' });
                }, 100);
            } else {
                setTimeout(() => switchPage(destination), 300);
            }
        }

        // --- Product View Logic ---
        function viewProduct(id) {
            const p = products.find(prod => prod.id === id);
            if(!p) return;

            document.getElementById('pdp-name').innerText = p.name;
            document.getElementById('pdp-price').innerText = p.price + '.00 RON';
            document.getElementById('pdp-desc').innerText = p.desc;

            const wrapper = document.getElementById('slider-wrapper');
            const dots = document.getElementById('slider-dots');
            
            // Setup Slider Images
            let imgHtml = `<img src="${p.image}">`;
            if (p.image2) imgHtml += `<img src="${p.image2}">`;
            wrapper.innerHTML = imgHtml;
            
            // Setup Dots & Buttons
            if (p.image2) {
                dots.innerHTML = '<div class="dot active"></div><div class="dot"></div>';
                document.querySelectorAll('.slider-btn').forEach(b => b.style.display = 'flex');
            } else {
                dots.innerHTML = '';
                document.querySelectorAll('.slider-btn').forEach(b => b.style.display = 'none');
            }
            
            currentSlideIndex = 0;
            updateSlider();
            switchPage('product-page');
        }

        function moveSlide(n) {
            const imgs = document.querySelectorAll('#slider-wrapper img');
            if (imgs.length < 2) return;
            currentSlideIndex = (currentSlideIndex + n + imgs.length) % imgs.length;
            updateSlider();
        }

        function updateSlider() {
            const wrapper = document.getElementById('slider-wrapper');
            wrapper.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentSlideIndex));
        }

        // --- Swipe Logic ---
        const sliderContainer = document.getElementById('slider-container');
        
        sliderContainer.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        sliderContainer.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            if (touchStartX - touchEndX > 50) moveSlide(1); // Swipe Left
            if (touchEndX - touchStartX > 50) moveSlide(-1); // Swipe Right
        }

        // --- Scroll Animation Observer ---
        function setupObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
        }

        // Run Init
        window.onload = init;

    </script>
</body>
</html>
