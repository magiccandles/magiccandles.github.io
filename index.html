<!DOCTYPE html>
<html lang="ro">
<head>
    <meta name="google-site-verification" content="JquvTxmipnlhSSfDwSYVKFbDTn8nVa7yGfwjpMPnAFM" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Candles & Art Deco | Lumina Magică</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ivory: #F9F7F2;
            --warm-sand: #DBCBB0;
            --charcoal: #1A1A1A;
            --gold: #C5A059;
            --transition-smooth: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--ivory);
            color: var(--charcoal);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 3000; 
            background: rgba(249, 247, 242, 0.95);
            backdrop-filter: blur(10px);
            height: 80px;
        }

        .logo { 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: 600; 
            cursor: pointer;
            line-height: 1.2;
        }

        .hamburger {
            cursor: pointer;
            z-index: 3100;
            width: 30px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
        }

        .hamburger span {
            display: block;
            height: 2px;
            background-color: var(--charcoal);
            transition: var(--transition-smooth);
        }

        .hamburger span:nth-child(1) { width: 100%; }
        .hamburger span:nth-child(2) { width: 70%; }
        .hamburger span:nth-child(3) { width: 100%; }
        
        .hamburger.active span:nth-child(1) { transform: translateY(9px) rotate(45deg); width: 100%; }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); width: 100%; }

        /* --- Menu Overlay --- */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: var(--ivory);
            z-index: 2500; 
            display: flex;
            justify-content: center;
            align-items: center;
            clip-path: circle(0% at 92% 5%); 
            transition: clip-path 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            pointer-events: none;
        }

        .menu-overlay.active { 
            clip-path: circle(150% at 92% 5%); 
            pointer-events: all;
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        .menu-links a {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: var(--charcoal);
            text-decoration: none;
            opacity: 0;
            transform: translateY(20px);
        }

        .menu-overlay.active .menu-links a { 
            opacity: 1; 
            transform: translateY(0); 
            transition: 0.5s ease forwards;
        }

        /* --- Hero --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('h1.jpg') center/cover;
            color: white;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 { font-size: 3rem; margin-bottom: 1.5rem; font-style: italic; }

        .btn-primary {
            padding: 1rem 2.5rem;
            background: var(--charcoal);
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            border: 1px solid var(--charcoal);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        /* --- Product Page Styling --- */
        #product-page .section-padding {
            padding-top: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pdp-grid {
            display: grid;
            grid-template-columns: 1fr; /* Mobile default: 1 column */
            gap: 2rem;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .pdp-visual {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slider-container {
            width: 100%;
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
        }

        .slider-wrapper {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            align-items: center;
        }

        .slider-wrapper img {
            min-width: 100%;
            height: auto;
            /* CHANGED: Made smaller (40vh instead of 55vh) */
            max-height: 40vh; 
            object-fit: contain;
            display: block;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.7);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            z-index: 5;
            cursor: pointer;
        }
        .slider-btn.prev { left: 10px; }
        .slider-btn.next { right: 10px; }

        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 15px 0;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; transition: 0.3s; }
        .dot.active { background: var(--charcoal); transform: scale(1.2); }

        .pdp-info { text-align: center; }
        .pdp-info h1 { font-size: 2.2rem; margin-bottom: 5px; }
        .price { font-size: 1.4rem; color: var(--gold); margin-bottom: 20px; display: block; font-family: 'Cormorant Garamond', serif;}
        .pdp-info p { color: #555; font-size: 1rem; }

        /* --- DESKTOP/TABLET RESPONSIVENESS for Product Page --- */
        @media (min-width: 850px) {
            .pdp-grid {
                grid-template-columns: 1.2fr 1fr; /* Image wider than text */
                gap: 5rem; /* More space between */
                max-width: 1000px; /* Allow wider container */
                align-items: center;
            }
            
            .slider-wrapper img {
                max-height: 500px; /* Fixed height for desktop */
            }

            .pdp-info {
                text-align: left; /* Left align text on big screens */
                padding-right: 20px;
            }
        }

        /* --- Grids --- */
        .section-padding { padding: 80px 5%; max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; gap: 30px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .product-card { text-align: center; cursor: pointer; }
        .img-box { height: 350px; background: #fff; margin-bottom: 15px; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: contain; }

        /* --- Switch Logic --- */
        .active-page { display: block !important; animation: fadeIn 0.4s ease; }
        #main-site, #all-products-view, #product-page { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- Footer & Map --- */
        footer { background: var(--charcoal); color: white; padding: 60px 5%; text-align: center; }
        
        .map-wrapper {
            width: 100%;
            height: 350px;
            margin-bottom: 40px;
            border-radius: 4px;
            overflow: hidden;
            filter: grayscale(20%); /* Optional: makes map look classy */
        }
        
        .footer-links { margin: 20px 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .footer-links a { color: var(--warm-sand); text-decoration: none; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="switchPage('main-site')">Magic Candles &<br>Art Deco</div>
        <div class="hamburger" id="nav-toggle">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <div class="menu-overlay" id="menu">
        <div class="menu-links">
            <a href="#" onclick="handleMenuLink('main-site')">Acasă</a>
            <a href="#" onclick="handleMenuLink('all-products-view')">Colecție</a>
            <a href="#footer-contact" onclick="handleMenuLink('footer')">Contact</a>
        </div>
    </div>

    <div id="main-site" class="active-page">
        <section class="hero">
            <h1>Artă și Lumină</h1>
            <button class="btn-primary" onclick="switchPage('all-products-view')" style="background:transparent; border: 1px solid white;">Vezi Colecția</button>
        </section>

        <section class="section-padding">
            <h2 style="text-align: center; margin-bottom: 40px; text-transform: uppercase;">Produse Recomandate</h2>
            <div class="grid" id="home-grid"></div>
            
            <div style="text-align: center; margin-top: 50px;">
                <button class="btn-primary" onclick="switchPage('all-products-view')">Mai multe produse</button>
            </div>
        </section>
        
        <footer id="footer-contact">
            <h3 style="margin-bottom: 20px; color: var(--warm-sand);">Locația Noastră</h3>
            <div class="map-wrapper">
                <iframe 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    style="border:0" 
                    src="https://maps.google.com/maps?q=Bacau,%20Romania&t=&z=13&ie=UTF8&iwloc=&output=embed" 
                    allowfullscreen>
                </iframe>
            </div>

            <p>Contactează-ne</p>
            <div class="footer-links">
                <a href="https://wa.me/407XXXXXXXX">WhatsApp</a>
                <a href="mailto:cristina_b_cretu@yahoo.com">Email</a>
                <a href="https://www.tiktok.com/@magic_light_behind_tears">TikTok</a>
            </div>
            <p style="margin-top: 40px; opacity: 0.4; font-size: 0.7rem;">© 2026 MAGIC CANDLES & ART DECO</p>
        </footer>
    </div>

    <div id="all-products-view">
        <div class="section-padding">
            <p onclick="switchPage('main-site')" style="cursor:pointer; margin-bottom: 20px; font-size: 0.8rem;">← ÎNAPOI</p>
            <h2 style="margin-bottom: 40px; text-transform: uppercase; text-align: center;">Întreaga Colecție</h2>
            <div class="grid" id="full-grid"></div>
        </div>
    </div>

    <div id="product-page">
        <div class="section-padding">
            <p onclick="window.history.back()" style="cursor:pointer; margin-bottom: 20px; font-size: 0.8rem; align-self: flex-start;">← ÎNAPOI</p>
            
            <div class="pdp-grid">
                <div class="pdp-visual">
                    <div class="slider-container" id="slider-container">
                        <button class="slider-btn prev" onclick="moveSlide(-1)">❮</button>
                        <button class="slider-btn next" onclick="moveSlide(1)">❯</button>
                        <div class="slider-wrapper" id="slider-wrapper"></div>
                    </div>
                    <div class="slider-dots" id="slider-dots"></div>
                </div>
                <div class="pdp-info">
                    <h1 id="pdp-name"></h1>
                    <span class="price" id="pdp-price"></span>
                    <p id="pdp-desc"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="products.js"></script>
    <script>
        let currentSlideIndex = 0;
        let touchStartX = 0;

        function init() {
            if (typeof products === 'undefined') return;
            document.getElementById('full-grid').innerHTML = products.map(p => createCard(p)).join('');
            document.getElementById('home-grid').innerHTML = products.slice(0, 3).map(p => createCard(p)).join('');
        }

        function createCard(p) {
            return `
                <div class="product-card" onclick="viewProduct(${p.id})">
                    <div class="img-box"><img src="${p.image}" alt="${p.name}"></div>
                    <h3>${p.name}</h3>
                    <p>${p.price}.00 RON</p>
                </div>
            `;
        }

        function switchPage(pageId, push = true) {
            document.querySelectorAll('#main-site, #all-products-view, #product-page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            window.scrollTo(0,0);
            if(push) history.pushState({page: pageId}, "", "");
        }

        window.onpopstate = (e) => switchPage(e.state?.page || 'main-site', false);

        const navToggle = document.getElementById('nav-toggle');
        const menu = document.getElementById('menu');

        navToggle.onclick = () => {
            navToggle.classList.toggle('active');
            menu.classList.toggle('active');
        };

        function handleMenuLink(destination) {
            navToggle.classList.remove('active');
            menu.classList.remove('active');
            setTimeout(() => {
                if(destination === 'footer') {
                    switchPage('main-site');
                    document.getElementById('footer-contact').scrollIntoView({behavior:'smooth'});
                } else {
                    switchPage(destination);
                }
            }, 400);
        }

        function viewProduct(id) {
            const p = products.find(prod => prod.id === id);
            if(!p) return;
            document.getElementById('pdp-name').innerText = p.name;
            document.getElementById('pdp-price').innerText = p.price + '.00 RON';
            document.getElementById('pdp-desc').innerText = p.desc;

            const wrapper = document.getElementById('slider-wrapper');
            const dots = document.getElementById('slider-dots');
            let imgHtml = `<img src="${p.image}">`;
            if (p.image2) imgHtml += `<img src="${p.image2}">`;
            wrapper.innerHTML = imgHtml;
            
            dots.innerHTML = p.image2 ? '<div class="dot active"></div><div class="dot"></div>' : '';
            document.querySelectorAll('.slider-btn').forEach(b => b.style.display = p.image2 ? 'block' : 'none');
            
            currentSlideIndex = 0;
            updateSlider();
            switchPage('product-page');
        }

        function moveSlide(n) {
            const imgs = document.querySelectorAll('#slider-wrapper img');
            if (imgs.length < 2) return;
            currentSlideIndex = (currentSlideIndex + n + imgs.length) % imgs.length;
            updateSlider();
        }

        function updateSlider() {
            const wrapper = document.getElementById('slider-wrapper');
            wrapper.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentSlideIndex));
        }

        const sliderContainer = document.getElementById('slider-container');
        sliderContainer.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, {passive: true});
        sliderContainer.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) moveSlide(1);
            if (touchEndX - touchStartX > 50) moveSlide(-1);
        }, {passive: true});

        window.onload = init;
    </script>
</body>
</html>
