<!DOCTYPE html>
<html lang="ro">
<head>
    <meta name="google-site-verification" content="JquvTxmipnlhSSfDwSYVKFbDTn8nVa7yGfwjpMPnAFM" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Candles & Art Deco | Lumina Magică</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ivory: #F9F7F2;
            --warm-sand: #DBCBB0;
            --charcoal: #1A1A1A;
            --transition-smooth: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--ivory);
            color: var(--charcoal);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2000; 
            background: rgba(249, 247, 242, 0.95);
            backdrop-filter: blur(10px);
            height: 70px;
        }

        .logo { 
            font-size: 1rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: 600; 
            cursor: pointer;
        }

        .hamburger {
            cursor: pointer;
            z-index: 2100;
        }

        .hamburger span {
            display: block;
            height: 2px;
            width: 25px;
            background-color: var(--charcoal);
            margin: 5px 0;
            transition: var(--transition-smooth);
        }
        
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        /* --- Menu Overlay --- */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: var(--ivory);
            z-index: 1500; 
            display: flex;
            justify-content: center;
            align-items: center;
            clip-path: circle(0% at 90% 5%);
            transition: clip-path 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .menu-overlay.active { clip-path: circle(150% at 90% 5%); }

        .menu-links a {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            color: var(--charcoal);
            text-decoration: none;
            margin: 1.5rem 0;
            opacity: 0;
            transform: translateY(20px);
        }

        .menu-overlay.active .menu-links a { 
            opacity: 1; 
            transform: translateY(0); 
            transition: 0.5s ease forwards;
        }

        /* --- Hero --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('h1.jpg') center/cover;
            color: white;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 { font-size: 2.8rem; margin-bottom: 1rem; font-style: italic; }

        .btn-primary {
            padding: 1rem 2.5rem;
            background: var(--charcoal);
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        /* --- Grids --- */
        .section-padding { padding: 60px 5%; max-width: 1200px; margin: 0 auto; }
        
        .grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .product-card {
            background: white;
            padding: 10px;
            text-align: center;
            cursor: pointer;
        }

        .img-box {
            height: 350px;
            margin-bottom: 15px;
            background: #fff;
        }

        .img-box img { width: 100%; height: 100%; object-fit: contain; }

        /* --- Product Page --- */
        #product-page, #all-products-view { padding-top: 90px; min-height: 100vh; }

        .pdp-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1024px) {
            .pdp-grid { grid-template-columns: 1.2fr 0.8fr; gap: 4rem; }
            .hero h1 { font-size: 5rem; }
        }

        /* --- Slider --- */
        .slider-container {
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
            background: #fff;
        }

        .slider-wrapper {
            display: flex;
            transition: transform 0.4s ease-out;
            width: 100%;
        }

        .slider-wrapper img {
            min-width: 100%;
            height: auto;
            max-height: 65vh;
            object-fit: contain;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.7);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .slider-btn.prev { left: 10px; }
        .slider-btn.next { right: 10px; }

        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 15px 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }

        .dot.active { background: var(--charcoal); width: 18px; border-radius: 4px; }

        .pdp-info h1 { font-size: 2.2rem; margin-bottom: 10px; }
        .price { font-size: 1.4rem; color: #8b7355; margin-bottom: 1.5rem; display: block;}

        /* --- Page Switch --- */
        .active-page { display: block !important; animation: fadeIn 0.4s ease; }
        #main-site, #all-products-view, #product-page { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- Footer --- */
        footer { background: var(--charcoal); color: white; padding: 50px 5%; text-align: center; }
        .footer-links { margin: 20px 0; display: flex; flex-direction: column; gap: 10px; }
        .footer-links a { color: var(--warm-sand); text-decoration: none; font-size: 0.9rem; }
        footer iframe { width: 100%; height: 300px; margin-top: 25px; border: 0; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="switchPage('main-site')">Magic Candles & Art Deco</div>
        <div class="hamburger" id="nav-toggle">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <div class="menu-overlay" id="menu">
        <div class="menu-links">
            <a href="#" onclick="closeMenu(); switchPage('main-site');">Acasă</a>
            <a href="#" onclick="closeMenu(); switchPage('all-products-view');">Colecție</a>
            <a href="#" onclick="closeMenu(); switchPage('main-site');">Contact</a>
        </div>
    </div>

    <div id="main-site" class="active-page">
        <section class="hero">
            <h1>Artă și Lumină</h1>
            <button class="btn-primary" onclick="switchPage('all-products-view')" style="background:transparent; border: 1px solid white;">Vezi Colecția</button>
        </section>

        <section class="section-padding">
            <h2 style="text-align: center; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px;">Produse Recomandate</h2>
            <div class="grid" id="home-grid"></div>
            
            <div style="text-align: center; margin-top: 40px;">
                <button class="btn-primary" onclick="switchPage('all-products-view')">Mai multe</button>
            </div>
        </section>
        
        <footer id="footer-contact">
            <p style="text-transform: uppercase; letter-spacing: 2px;">Contactează-ne</p>
            <div class="footer-links">
                <a href="https://wa.me/407XXXXXXXX" target="_blank">WhatsApp: +40 7XX XXX XXX</a>
                <a href="mailto:cristina_b_cretu@yahoo.com">Email</a>
                <a href="https://www.tiktok.com/@magic_light_behind_tears" target="_blank">TikTok</a>
            </div>
            <iframe src="https://maps.google.com/?cid=2763474062391980801&g_mp=CiVnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLkdldFBsYWNl"></iframe>
            <p style="margin-top: 40px; opacity: 0.4; font-size: 0.7rem;">© 2026 MAGIC CANDLES & ART DECO</p>
        </footer>
    </div>

    <div id="all-products-view">
        <div class="section-padding">
            <p onclick="switchPage('main-site')" style="cursor:pointer; margin-bottom: 25px; font-size: 0.8rem; letter-spacing: 1px;">← ÎNAPOI LA ACASĂ</p>
            <h2 style="margin-bottom: 40px; text-transform: uppercase;">Întreaga Colecție</h2>
            <div class="grid" id="full-grid"></div>
        </div>
    </div>

    <div id="product-page">
        <div class="section-padding">
            <p onclick="window.history.back()" style="cursor:pointer; margin-bottom: 25px; font-size: 0.8rem; letter-spacing: 1px;">← ÎNAPOI</p>
            <div class="pdp-grid">
                <div class="pdp-visual">
                    <div class="slider-container" id="slider-container">
                        <button class="slider-btn prev" onclick="moveSlide(-1)">❮</button>
                        <button class="slider-btn next" onclick="moveSlide(1)">❯</button>
                        <div class="slider-wrapper" id="slider-wrapper"></div>
                    </div>
                    <div class="slider-dots" id="slider-dots"></div>
                </div>
                <div class="pdp-info">
                    <h1 id="pdp-name"></h1>
                    <span class="price" id="pdp-price"></span>
                    <p id="pdp-desc" style="color: #555; font-size: 1.1rem;"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="products.js"></script>
    <script>
        let currentSlideIndex = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        function init() {
            if (typeof products === 'undefined') return;
            const hGrid = document.getElementById('home-grid');
            const fGrid = document.getElementById('full-grid');
            
            // Render Full Grid
            fGrid.innerHTML = products.map(p => createCard(p)).join('');
            
            // Render first 3 for Home Grid
            hGrid.innerHTML = products.slice(0, 3).map(p => createCard(p)).join('');
        }

        function createCard(p) {
            return `
                <div class="product-card" onclick="viewProduct(${p.id})">
                    <div class="img-box"><img src="${p.image}" alt="${p.name}"></div>
                    <h3>${p.name}</h3>
                    <p style="color: #8b7355; font-weight: 500;">${p.price}.00 RON</p>
                </div>
            `;
        }

        function switchPage(pageId, push = true) {
            document.querySelectorAll('#main-site, #all-products-view, #product-page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            window.scrollTo(0,0);
            if(push) history.pushState({page: pageId}, "", "");
        }

        window.onpopstate = (e) => switchPage(e.state?.page || 'main-site', false);

        function viewProduct(id) {
            const p = products.find(prod => prod.id === id);
            if(!p) return;

            document.getElementById('pdp-name').innerText = p.name;
            document.getElementById('pdp-price').innerText = p.price + '.00 RON';
            document.getElementById('pdp-desc').innerText = p.desc;

            const wrapper = document.getElementById('slider-wrapper');
            const dots = document.getElementById('slider-dots');
            
            // Setup Slider Images
            let imgHtml = `<img src="${p.image}">`;
            if (p.image2) imgHtml += `<img src="${p.image2}">`;
            wrapper.innerHTML = imgHtml;
            
            // Setup Dots & Buttons
            dots.innerHTML = p.image2 ? '<div class="dot active"></div><div class="dot"></div>' : '';
            document.querySelectorAll('.slider-btn').forEach(b => b.style.display = p.image2 ? 'flex' : 'none');
            
            currentSlideIndex = 0;
            updateSlider();
            switchPage('product-page');
        }

        function moveSlide(n) {
            const imgs = document.querySelectorAll('#slider-wrapper img');
            if (imgs.length < 2) return;
            currentSlideIndex = (currentSlideIndex + n + imgs.length) % imgs.length;
            updateSlider();
        }

        function updateSlider() {
            const wrapper = document.getElementById('slider-wrapper');
            wrapper.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentSlideIndex));
        }

        // Swipe Logic
        const sliderContainer = document.getElementById('slider-container');
        sliderContainer.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        sliderContainer.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) moveSlide(1);
            if (touchEndX - touchStartX > 50) moveSlide(-1);
        });

        // Hamburger Menu
        const navToggle = document.getElementById('nav-toggle');
        const menu = document.getElementById('menu');
        navToggle.onclick = () => { navToggle.classList.toggle('active'); menu.classList.toggle('active'); };
        function closeMenu() { navToggle.classList.remove('active'); menu.classList.remove('active'); }

        init();
    </script>
</body>
</html>
